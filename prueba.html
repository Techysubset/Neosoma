<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cambio de imagen con hover</title>
    <style>
      .imagen-hover {
        width: 300px;
        height: 200px;
        background-image: url("images/abuela.jpeg"); /* Imagen inicial */
        background-size: cover;
        background-position: center;
        transition: background-image 0.5s ease-in-out; /* Suaviza el cambio */
      }

      /* Cuando el mouse pasa por encima */
      .imagen-hover:hover {
        background-image: url("images/Actually.jpg"); /* Imagen al pasar el mouse */
      }
    </style>
  </head>
  <body>
    <div class="imagen-hover"></div>
  </body>
</html>
