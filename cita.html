<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cita</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <svg
            class="icon-activity"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="color: #00d9ff"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
          </svg>
          <h1>Neosoma</h1>
        </div>
       </header>
      
        <p class="mb-6 text-white"
        style="justify-content: center;">
          Selecciona las áreas de tu cuerpo donde sientes molestias
        </p>
      </div>

      <div class="body-map-container">
        <div style="position: relative">
          <svg
            class="body-map-svg"
            width="300"
            height="450"
            viewBox="0 0 300 450"
          >
            <!-- Efecto de brillo -->
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                <feMerge>
                  <feMergeNode in="coloredBlur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- Silueta del cuerpo -->
            <g
              fill="none"
              stroke="#00d9ff"
              stroke-width="2"
              filter="url(#glow)"
            >
              <circle
                cx="150"
                cy="40"
                r="25"
                fill="#00d9ff"
                fill-opacity="0.1"
              />
              <line x1="150" y1="65" x2="150" y2="90" />
              <line x1="100" y1="100" x2="200" y2="100" />
              <path
                d="M 100 100 L 90 140 L 95 180 L 100 230 L 130 250"
                fill="#00d9ff"
                fill-opacity="0.05"
              />
              <path
                d="M 200 100 L 210 140 L 205 180 L 200 230 L 170 250"
                fill="#00d9ff"
                fill-opacity="0.05"
              />
              <line x1="100" y1="230" x2="200" y2="230" />
              <line x1="100" y1="100" x2="75" y2="160" />
              <line x1="75" y1="160" x2="60" y2="200" />
              <line x1="60" y1="200" x2="50" y2="240" />
              <line x1="200" y1="100" x2="225" y2="160" />
              <line x1="225" y1="160" x2="240" y2="200" />
              <line x1="240" y1="200" x2="250" y2="240" />
              <line x1="130" y1="250" x2="130" y2="310" />
              <line x1="130" y1="310" x2="130" y2="380" />
              <path
                d="M 125 380 L 130 400 L 135 380 Z"
                fill="#00d9ff"
                fill-opacity="0.1"
              />
              <line x1="170" y1="250" x2="170" y2="310" />
              <line x1="170" y1="310" x2="170" y2="380" />
              <path
                d="M 165 380 L 170 400 L 175 380 Z"
                fill="#00d9ff"
                fill-opacity="0.1"
              />
            </g>

            <!-- Puntos interactivos -->
            <g id="bodyPoints"></g>
          </svg>
          
          <div
          id="selectedAreasContainer"
          style="display: none"
          class="selected-areas"
          >
          <p class="text-cyan-400 mb-4">Áreas seleccionadas:</p>
          <div class="selected-tags" id="selectedTags"></div>
        </div>
      </div>
    </div>

     
      </div>
      <div id="cajita">
        
        <label id="nombre">Nombre:</label>
        <input type="text" id="nombre" />
        
        <label id="correo">Correo:</label>
        <input type="email" name="email" />
        
        <label id="numero">Numero celular:</label>
        <input type="number" name="Numero celular" />
        
        <button type="submit">Enviar</button>
      </div>
    </div>
    <script src="pagg.js"></script>
  </body>
</html>
